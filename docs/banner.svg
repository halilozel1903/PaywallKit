<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="PaywallKit: ready-made StoreKit 2 paywalls for SwiftUI" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120a2e"/>
      <stop offset="1" stop-color="#1d0f24"/>
    </linearGradient>
    <radialGradient id="blob1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c45ed" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#7c45ed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a7a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff8a7a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6ccff"/>
      <stop offset="0.45" stop-color="#f6bce2"/>
      <stop offset="0.8" stop-color="#ffa096"/>
      <stop offset="1" stop-color="#ffb880"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d3fe0"/>
    </linearGradient>
    <linearGradient id="screenPad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ece4ff"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="phoneScreen">
      <rect x="650" y="160" width="190" height="370" rx="30"/>
    </clipPath>
  </defs>

  <rect width="1280" height="560" fill="url(#bg)"/>
  <circle cx="900" cy="140" r="250" fill="url(#blob1)" filter="url(#blur)"/>
  <circle cx="1150" cy="470" r="220" fill="url(#blob2)" filter="url(#blur)"/>

  <g font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="80" y="225" fill="#ffffff" font-size="68" font-weight="800" letter-spacing="-2">PaywallKit</text>
    <text x="82" y="280" fill="#d8cffa" font-size="27" font-weight="500">StoreKit 2 paywalls for SwiftUI</text>
    <text x="82" y="316" fill="#a59cc4" font-size="21" font-weight="500">iPhone · iPad · Mac</text>
    <g font-size="19" font-weight="600">
      <rect x="82" y="350" width="134" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="149" y="376" fill="#ede9fe" text-anchor="middle">StoreKit 2</text>
      <rect x="228" y="350" width="140" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="298" y="376" fill="#ede9fe" text-anchor="middle">3 templates</text>
      <rect x="82" y="402" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="157" y="428" fill="#ede9fe" text-anchor="middle">Liquid Glass</text>
      <rect x="244" y="402" width="104" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="296" y="428" fill="#ede9fe" text-anchor="middle">Swift 6</text>
      <rect x="360" y="402" width="80" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="400" y="428" fill="#ede9fe" text-anchor="middle">SPM</text>
    </g>

    <!-- iPad: the free vs Pro comparison paywall -->
    <g transform="translate(40 0)">
      <g filter="url(#shadow)">
        <rect x="760" y="70" width="440" height="330" rx="26" fill="#1c1f26" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
      </g>
      <rect x="772" y="82" width="416" height="306" rx="16" fill="url(#screenPad)"/>
      <g transform="translate(62 0)">
      <rect x="958" y="96" width="44" height="44" rx="12" fill="url(#violet)"/>
      <circle cx="980" cy="118" r="11" fill="none" stroke="#ffffff" stroke-width="3"/>
      <circle cx="980" cy="118" r="4" fill="#ffffff"/>
      <text x="980" y="164" fill="#111827" font-size="17" font-weight="800" text-anchor="middle">Lumina Free vs Pro</text>

      <rect x="860" y="176" width="240" height="132" rx="12" fill="#6d3fe0" fill-opacity="0.05" stroke="#6d3fe0" stroke-opacity="0.15"/>
      <rect x="1050" y="180" width="44" height="124" rx="9" fill="#7c45ed" fill-opacity="0.14"/>
      <g font-size="10">
        <text x="872" y="194" fill="#6b7280" font-weight="700">Features</text>
        <text x="1028" y="194" fill="#6b7280" font-weight="700" text-anchor="middle">Free</text>
        <text x="1072" y="194" fill="#6d3fe0" font-weight="800" text-anchor="middle">Pro</text>

        <text x="872" y="218" fill="#111827">120 film filters</text>
        <text x="1028" y="218" fill="#6b7280" font-weight="700" text-anchor="middle">12</text>
        <text x="1072" y="218" fill="#6d3fe0" font-weight="700" text-anchor="middle">All</text>

        <text x="872" y="242" fill="#111827">AI retouch</text>
        <rect x="1023" y="237" width="10" height="2" rx="1" fill="#9ca3af"/>
        <circle cx="1072" cy="238" r="6" fill="#6d3fe0"/>
        <path d="M1069 238 L1071 240 L1075 236" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

        <text x="872" y="266" fill="#111827">RAW editing</text>
        <rect x="1023" y="261" width="10" height="2" rx="1" fill="#9ca3af"/>
        <circle cx="1072" cy="262" r="6" fill="#6d3fe0"/>
        <path d="M1069 262 L1071 264 L1075 260" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

        <text x="872" y="290" fill="#111827">Batch export</text>
        <text x="1028" y="290" fill="#6b7280" font-weight="700" text-anchor="middle">5</text>
        <text x="1072" y="290" fill="#6d3fe0" font-weight="700" text-anchor="middle">500</text>
      </g>
      <rect x="880" y="330" width="200" height="34" rx="17" fill="#6d3fe0"/>
      <text x="980" y="352" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Start Free Trial</text>
      </g>
    </g>

    <!-- iPhone: the hero paywall -->
    <g transform="translate(70 0)">
      <g filter="url(#shadow)">
        <rect x="640" y="150" width="210" height="390" rx="38" fill="#1c1f26" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
      </g>
      <rect x="650" y="160" width="190" height="370" rx="30" fill="#ffffff"/>
      <g clip-path="url(#phoneScreen)">
        <rect x="650" y="160" width="190" height="120" fill="url(#sky)"/>
        <circle cx="770" cy="248" r="16" fill="#fff3cf"/>
        <path d="M650 262 L672 244 L690 254 L712 232 L735 252 L752 242 L780 258 L805 236 L840 254 L840 280 L650 280 Z" fill="#963a82"/>
        <path d="M650 272 L680 260 L712 268 L745 256 L780 268 L812 258 L840 266 L840 280 L650 280 Z" fill="#62226a"/>
        <rect x="650" y="236" width="190" height="46" fill="url(#fade)"/>
      </g>
      <rect x="715" y="170" width="60" height="16" rx="8" fill="#111827"/>
      <text x="745" y="298" fill="#111827" font-size="18" font-weight="800" text-anchor="middle">Lumina Pro</text>
      <text x="745" y="314" fill="#6b7280" font-size="9" text-anchor="middle">Every filter, every tool, no watermark.</text>

      <rect x="664" y="326" width="162" height="40" rx="10" fill="#7c45ed" fill-opacity="0.1" stroke="#6d3fe0" stroke-width="1.6"/>
      <circle cx="678" cy="346" r="5.5" fill="#6d3fe0"/>
      <path d="M675.5 346 L677.5 348 L681 344" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="690" y="343" fill="#111827" font-size="10" font-weight="700">Yearly</text>
      <text x="690" y="356" fill="#6b7280" font-size="8">Just $3.33/month</text>
      <text x="818" y="345" fill="#111827" font-size="10" font-weight="700" text-anchor="end">$39.99</text>
      <text x="818" y="356" fill="#6b7280" font-size="8" text-anchor="end">per year</text>
      <rect x="770" y="319" width="48" height="13" rx="6.5" fill="#6d3fe0"/>
      <text x="794" y="328.5" fill="#fff" font-size="7.5" font-weight="800" text-anchor="middle">Save 33%</text>

      <rect x="664" y="374" width="162" height="40" rx="10" fill="#6b7280" fill-opacity="0.08" stroke="#6b7280" stroke-opacity="0.2"/>
      <circle cx="678" cy="394" r="5.5" fill="none" stroke="#9ca3af" stroke-width="1.3"/>
      <text x="690" y="391" fill="#111827" font-size="10" font-weight="700">Monthly</text>
      <text x="690" y="404" fill="#6b7280" font-size="8">Just $1.15/week</text>
      <text x="818" y="393" fill="#111827" font-size="10" font-weight="700" text-anchor="end">$4.99</text>
      <text x="818" y="404" fill="#6b7280" font-size="8" text-anchor="end">per month</text>

      <rect x="664" y="422" width="162" height="40" rx="10" fill="#6b7280" fill-opacity="0.08" stroke="#6b7280" stroke-opacity="0.2"/>
      <circle cx="678" cy="442" r="5.5" fill="none" stroke="#9ca3af" stroke-width="1.3"/>
      <text x="690" y="439" fill="#111827" font-size="10" font-weight="700">Lifetime</text>
      <text x="690" y="452" fill="#6b7280" font-size="8">One-time purchase</text>
      <text x="818" y="441" fill="#111827" font-size="10" font-weight="700" text-anchor="end">$79.99</text>
      <text x="818" y="452" fill="#6b7280" font-size="8" text-anchor="end">once</text>

      <rect x="664" y="474" width="162" height="30" rx="15" fill="#6d3fe0"/>
      <rect x="664" y="474" width="162" height="15" rx="7.5" fill="#ffffff" fill-opacity="0.12"/>
      <text x="745" y="493" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Start Free Trial</text>
      <text x="745" y="516" fill="#6b7280" font-size="7.5" text-anchor="middle">1 week free, then $39.99/year</text>
    </g>
  </g>
</svg>
